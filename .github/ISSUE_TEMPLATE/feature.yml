name: 功能建议
description: 提议通用、可复用的组件库能力
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: use-case
    attributes:
      label: 使用场景
      description: 现有 API 为什么无法完成？请描述通用场景，不要提交业务需求。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 最小方案
      description: 建议的行为或 API，以及可以不做的部分。
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: 性能、平台和无障碍影响
      description: 包括 Android、减少动画和降级显示。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 该需求与具体业务无关
          required: true
        - label: 我已检查现有公开 API 和 Issue
          required: true
