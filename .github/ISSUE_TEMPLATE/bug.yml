name: Bug 报告
description: 报告可复现的组件、渲染、性能或兼容性问题
title: "fix: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: 请提供最小复现，避免提交业务代码或敏感信息。
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 实际结果与预期结果分别是什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现步骤
      placeholder: |
        1. 使用 GlassSurface...
        2. 切换到...
        3. 观察到...
    validations:
      required: true
  - type: input
    id: flutter
    attributes:
      label: Flutter / Dart 版本
      placeholder: Flutter 3.44.4, Dart 3.12.2
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: 平台和设备
      placeholder: Android 15 / Pixel 8，或 Edge 版本号
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 日志、截图或 profile 数据
      description: 可拖入附件；请先移除路径、账号等敏感信息。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我确认这是组件库问题，而不是业务代码问题
          required: true
        - label: 我已搜索现有 Issue
          required: true
